server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any unmatched path falls back to index.html so client-side routing (if
    # added later) doesn't 404 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything the API client calls proxies to the gateway container, so the
    # browser only ever talks to one origin and never needs CORS.
    location ~ ^/(v1|stats|health|requests|admin|metrics)(/|$) {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

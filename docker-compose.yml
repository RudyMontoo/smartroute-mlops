# Development stack: builds the gateway image locally.
# For the published-image equivalent see docker-compose.prod.yml.

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: smartroute-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    # --serve-artifacts lets the gateway pull a registered model over HTTP instead of
    # needing a shared artifact volume, which is what makes the registry work the same
    # way locally, in CI and in Kubernetes.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: seeds the registry so a fresh `docker compose up` has a @champion to
  # serve. Exits 0 and stays exited; the gateway waits for it to finish.
  trainer:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: smartroute-trainer
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: ["python", "-m", "router.train"]
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: smartroute-gateway
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_SOURCE: registry
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ROUTER_THRESHOLD: ${ROUTER_THRESHOLD:-0.60}
      DB_PATH: /app/data/gateway.db
    volumes:
      - gateway_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: smartroute-frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  mlflow_data:
  gateway_data:
